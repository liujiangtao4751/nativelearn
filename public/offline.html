<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#376b75" />
    <title>原习离线模式</title>
    <style>
      :root {
        color: #203843;
        background: #eef5f4;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid #d8e7e6;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(44, 72, 80, 0.14);
      }

      img {
        width: 56px;
        height: 56px;
        display: block;
      }

      h1 {
        margin: 18px 0 8px;
        color: #17313d;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5b7178;
        font-size: 14px;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        padding: 0 16px;
        border-radius: 8px;
        color: #ffffff;
        background: #376b75;
        text-decoration: none;
        font-size: 15px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/nativelearn-icon.svg" alt="原习 NativeLearn" />
      <h1>当前处于离线模式</h1>
      <p>已缓存的页面和最近学习状态可以继续查看。视频素材和需要 AI 的功能会在恢复网络后继续。</p>
      <a href="./">回到原习</a>
    </main>
  </body>
</html>
